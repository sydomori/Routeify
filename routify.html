<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routeify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/header/header.css">
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/header/header-content-1.css">
  <link rel="stylesheet" href="styles/header/header-content-2.css">
  <link rel="stylesheet" href="styles/header/header-content-3.css">
  <link rel="stylesheet" href="styles/sidebar/sidebar.css">
  <link rel="stylesheet" href="styles/sidebar/route-setup.css">
  <link rel="stylesheet" href="styles/sidebar/optimization-preferences.css">
  <link rel="stylesheet" href="styles/sidebar/actions.css">
  <link rel="stylesheet" href="styles/sidebar/summary.css">
</head>
<body>
  <div class="body">
    <aside class="sidebar">

      <div class="header-content-1">
        <div class="logo-div">
         <h1>Routeify</h1>
        </div>
      </div>

      <form class="route-setup">

        <div>
          <input type="text" id="start-location" name="start-location" placeholder="Enter start location">
        </div>

        <div>
          <input type="text" id="end-location" name="end-location" placeholder="Enter end location">
        </div>

        <div>
          <input type="submit" id="add-stop" value="Add Stop">
          <button class="added-stops-list">Stops List</button>
        </div>

      </form>

      <form class="optimization-preferences">

        <fieldset class="transport-preferences">
          <label for="transport-mode">Transport Mode:</label>
          <div class="trans-mode-container">
            <select class="trans-mode" name="transport-mode" id="transport-mode">
              <option value="driving">Driving</option>
              <option value="walking">Walking</option>
              <option value="electric-vehicle">Electric Vehicle</option>
              <option value="transit">Truck</option>
          </select>
          </div>
        </fieldset>

        <fieldset class="optimization-type">
          <label for="opt-type">Optimization Type:</label>
          <div class="opt-type-container">
            <select name="optimization-type" class="opt-type" id="opt-type">
             <option value="fastest">Fastest</option>
             <option value="shortest">Shortest</option>
             <option value="fuel-efficient">Fuel-Efficient</option>
             <option value="balanced">Balanced</option>
            </select>
          </div>
        </fieldset>

      </form>


      <div class="actions">
        <button class="generate-route">Generate Route</button>
        <button class="clear-route">Clear Route</button>
      </div>
      
      <div class="summary">
        <h3>Route Summary</h3>
        <p>Total Distance: <span id="total-distance">0 km</span></p>
        <p>Estimated Time: <span id="estimated-time">0 mins</span></p>
        <p>Estimated Distance: <span id="estimated-distance">0 km</span></p>
      </div>

    </aside>

    <header class="header">
      <div class="header-content-2">
        <nav class="navigation">
          <button>
            <a href="routify.html">Dashboard</a>
          </button>

          <button>
            <a href="analytics.html">Analytics</a>
          </button>

          <button>
            <a href="settings.html">Settings</a>
          </button>

          <button>
            <a href="#">Profile</a>
          </button>
        
        </nav>
      </div>
      <div class="header-content-3">
        <button class="dark-mode">
          <span class="dark-mode-icon">🌙</span>
        </button>
      </div>
    </header>
    <div class="main-content"></div>
      
  </div>
  <script src="script.js"></script>
</body>
</html>
