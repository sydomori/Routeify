<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routeify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/header/header.css">
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/header/header-content-1.css">
  <link rel="stylesheet" href="styles/header/header-content-2.css">
</head>
<body>
  <div class="body">
    <header class="header">
      <div class="header-content-1">

        <div class="logo">

          <div class="logo-div">
            <img src="images/global-communication-background-business-network-design.jpg" alt="Routeify Logo">
          </div>

          <span>Routeify</span>
        </div>
      </div>

      <div class="header-content-2">

        <div class="header-actions">
          <button class="analytics">Analytics</button>
          <button class="settings">Settings</button>
          <button class="dark-mode">
            <span class="dark-mode-icon">🌙</span>
          </button>
        </div>

        <div class="user-profile">
          <img src="assets/user-avatar.png" alt="User Avatar">
          <span>John Doe</span>
        </div>
      </div>
    </header>
  </div>
  <script src="script.js"></script>
</body>
</html>
